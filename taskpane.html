<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PowerPoint Issue Tracker</title>
  <link rel="stylesheet" href="taskpane.css?v=1.3.1" />
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <main class="app">
    <h1>Issue Tracker <span style="font-size:11px;font-weight:400;color:#6b7280;">v1.3.1</span></h1>
    <p class="muted">One issue per slide. PowerPoint controls visual formatting; the add-in controls tracker data.</p>

    <section class="card">
      <label for="issueId">Current issue ID</label>
      <div class="row">
        <input id="issueId" placeholder="MEP-001" autocomplete="off" />
        <button id="setIssueId">Set ID</button>
      </div>
      <div id="issueStatus" class="status muted">No issue loaded.</div>
    </section>

    <section class="card">
      <h2>Add boxes</h2>
      <div class="stack">
        <button id="addDescription">+ Description</button>
        <button id="addStatus">+ Status</button>
        <button id="addRemark">+ Remark</button>
      </div>
    </section>

    <section class="card">
      <h2>Status</h2>
      <div class="row">
        <select id="statusSelect"></select>
        <button id="applyStatus">Apply</button>
      </div>
      <details>
        <summary>Manage statuses</summary>
        <div id="statusList" class="status-list"></div>
        <div class="row">
          <input id="newStatus" placeholder="New status" />
          <button id="addStatusValue">Add</button>
        </div>
      </details>
    </section>


    <section class="card">
      <h2>Issue navigator</h2>
      <div class="row">
        <select id="issueNavigator"></select>
        <button id="goToIssue">Go</button>
      </div>
      <p class="muted small">Uses the Issue ID, not the PowerPoint slide number.</p>
    </section>

    <section class="card">
      <h2>Tools</h2>
      <div class="stack">
        <button id="repairCurrentSlide">Repair Current Slide</button>
        <button id="validate">Validate Presentation</button>
        <button id="generateSummary">Generate / Refresh Summary</button>
      </div>
      <div id="result" class="result muted"></div>
    </section>
  </main>

  <script src="taskpane.js?v=1.3.1"></script>
</body>
</html>
